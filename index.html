<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARLEM - Jastip Pasar Malam Wanajaya</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl border-x border-slate-200">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white p-5 text-center rounded-b-2xl shadow-lg border-b-2 border-blue-500/30">
    <h1 class="text-3xl font-extrabold tracking-wider text-blue-40">SARLEM</h1>
    <p class="text-xs uppercase font-semibold tracking-widest text-blue-300 mt-1">Pasar Malam Wanajaya</p>
    <div class="mt-2 inline-block bg-blue-600/30 backdrop-blur-md px-3 py-0.5 rounded-full text-[10px] text-blue-200 border border-blue-400/30">
      ⚡ Khusus Malam Selasa
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="p-4 space-y-5 flex-1">

    <!-- SLIDER (3 GAMBAR, DURATION 4 DETIK) -->
    <div class="relative overflow-hidden rounded-xl shadow-md bg-slate-900 h-36">
      <div id="slider" class="flex transition-transform duration-700 ease-in-out h-full">
        <div class="min-w-full h-full relative">
          <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-70" alt="Banner 1" />
          <div class="absolute bottom-2 left-3 text-white text-xs font-bold drop-shadow">Jastip Jajanan Murah & Cepat</div>
        </div>
        <div class="min-w-full h-full relative">
          <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-70" alt="Banner 2" />
          <div class="absolute bottom-2 left-3 text-white text-xs font-bold drop-shadow">Siap Antar Sampai Depan Rumah</div>
        </div>
        <div class="min-w-full h-full relative">
          <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-70" alt="Banner 3" />
          <div class="absolute bottom-2 left-3 text-white text-xs font-bold drop-shadow">Pasar Malam Wanajaya Malam Ini!</div>
        </div>
      </div>
      <!-- Indicator Dots -->
      <div class="absolute bottom-1.5 right-3 flex space-x-1">
        <span class="dot w-2 h-2 rounded-full bg-white opacity-100 transition"></span>
        <span class="dot w-2 h-2 rounded-full bg-white opacity-40 transition"></span>
        <span class="dot w-2 h-2 rounded-full bg-white opacity-40 transition"></span>
      </div>
    </div>

    <!-- GRID KATEGORI (2 KATEGORI RESPONSIP & CORAK MODERN) -->
    <section class="grid grid-cols-2 gap-3">
      <button onclick="switchCategory('makanan')" id="btn-makanan" class="p-4 rounded-xl bg-slate-900 text-white font-bold text-center border-2 border-blue-500 shadow-md transition-all active:scale-95">
        <div class="text-base tracking-wide uppercase">1. MAKANAN</div>
        <div class="text-[10px] font-normal text-blue-300 mt-1">Aneka Jajanan</div>
      </button>
      <button onclick="switchCategory('minuman')" id="btn-minuman" class="p-4 rounded-xl bg-white text-slate-900 font-bold text-center border-2 border-slate-200 shadow-md transition-all active:scale-95">
        <div class="text-base tracking-wide uppercase">2. MINUMAN</div>
        <div class="text-[10px] font-normal text-slate-500 mt-1">Segar & Manis</div>
      </button>
    </section>

    <!-- MENU LIST (TANPA ICON / GAMBAR) -->
    <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
      <h2 id="category-title" class="font-bold text-slate-900 text-sm mb-3 border-b border-slate-100 pb-2 flex justify-between items-center">
        <span>DAFTAR MAKANAN</span>
        <span class="text-[10px] text-slate-400 font-normal">Pilih & Atur Jumlah</span>
      </h2>

      <div id="menu-items-container" class="divide-y divide-slate-100">
        <!-- Item akan dirender lewat Javascript -->
      </div>
    </section>

  </main>

  <!-- BOTTOM STICKY BAR & FOOTER -->
  <footer class="sticky bottom-0 bg-white border-t border-slate-200 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] p-4 space-y-3">
    <!-- Total & Button -->
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Total Pesanan</div>
        <div id="total-price" class="text-xl font-black text-slate-900">Rp 0</div>
      </div>
      <button onclick="sendOrderWA()" class="bg-blue-900 hover:bg-blue-950 text-white font-bold px-5 py-3 rounded-xl shadow-lg active:scale-95 transition flex items-center gap-2">
        <span>Pesan Sekarang</span>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.754zm6.097-4.908l.341.202c1.44.854 3.094 1.305 4.781 1.306 5.226 0 9.48-4.254 9.483-9.482.001-2.532-.986-4.912-2.778-6.704-1.791-1.792-4.172-2.78-6.708-2.78-5.228 0-9.481 4.253-9.483 9.482-.001 1.74.472 3.441 1.369 4.966l.22.375-1.071 3.91 3.997-1.048z"/></svg>
      </button>
    </div>

    <!-- Credit Footer -->
    <div class="text-center border-t border-slate-100 pt-2">
      <p class="text-[11px] font-semibold text-slate-400">aplikasi ini di buat oleh team bledosss</p>
    </div>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // DATA MENUS (CUMA NAMA & HARGA, TANPA ICON/GAMBAR)
    const menus = {
      makanan: [
        { id: 'm1', name: 'Martabak Telur', price: 15000 },
        { id: 'm2', name: 'Kerak Telor', price: 15000 },
        { id: 'm3', name: 'Dimsum Porsi (4 pcs)', price: 12000 },
        { id: 'm4', name: 'Sosis Bakar Jumbo', price: 10000 },
        { id: 'm5', name: 'Lekker Manis (3 pcs)', price: 5000 },
        { id: 'm6', name: 'Kue Molen (10 pcs)', price: 5000 },
        { id: 'm7', name: 'Crepes Coklat Keju', price: 8000 }
      ],
      minuman: [
        { id: 'd1', name: 'Es Teh Solo Jumbo', price: 5000 },
        { id: 'd2', name: 'Es Jeruk Peras', price: 6000 },
        { id: 'd3', name: 'Es Boba Gula Aren', price: 10000 },
        { id: 'd4', name: 'Es Cappucino Cincau', price: 8000 },
        { id: 'd5', name: 'Es Kelapa Muda', price: 7000 },
        { id: 'd6', name: 'Air Mineral Botol', price: 4000 }
      ]
    };

    let currentCategory = 'makanan';
    let selectedItems = {}; // { id: { name, price, qty, checked } }

    // NUMBER WHATSAPP ADMIN / DRIVER (Ganti dengan nomor WhatsApp Anda)
    const WA_NUMBER = "6281234567890";

    // CAROUSEL SLIDER (AUTOMATIC 4 DETIK)
    let currentSlide = 0;
    const slider = document.getElementById('slider');
    const dots = document.querySelectorAll('.dot');
    setInterval(() => {
      currentSlide = (currentSlide + 1) % 3;
      slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      dots.forEach((dot, index) => {
        dot.style.opacity = index === currentSlide ? '1' : '0.4';
      });
    }, 4000);

    // SWITCH CATEGORY
    function switchCategory(cat) {
      currentCategory = cat;
      const btnM = document.getElementById('btn-makanan');
      const btnD = document.getElementById('btn-minuman');
      const title = document.getElementById('category-title');

      if (cat === 'makanan') {
        btnM.className = "p-4 rounded-xl bg-slate-900 text-white font-bold text-center border-2 border-blue-500 shadow-md transition-all active:scale-95";
        btnD.className = "p-4 rounded-xl bg-white text-slate-900 font-bold text-center border-2 border-slate-200 shadow-md transition-all active:scale-95";
        title.children[0].innerText = "DAFTAR MAKANAN";
      } else {
        btnD.className = "p-4 rounded-xl bg-slate-900 text-white font-bold text-center border-2 border-blue-500 shadow-md transition-all active:scale-95";
        btnM.className = "p-4 rounded-xl bg-white text-slate-900 font-bold text-center border-2 border-slate-200 shadow-md transition-all active:scale-95";
        title.children[0].innerText = "DAFTAR MINUMAN";
      }
      renderMenuList();
    }

    // RENDER MENU ITEMS
    function renderMenuList() {
      const container = document.getElementById('menu-items-container');
      const itemList = menus[currentCategory];

      container.innerHTML = itemList.map(item => {
        const itemState = selectedItems[item.id] || { checked: false, qty: 1 };
        return `
          <div class="py-3 flex items-center justify-between gap-2">
            <div class="flex-1">
              <div class="font-bold text-sm text-slate-800">${item.name}</div>
              <div class="text-xs font-semibold text-blue-900">Rp ${item.price.toLocaleString('id-ID')}</div>
            </div>

            <div class="flex items-center gap-3">
              ${itemState.checked ? `
                <div class="flex items-center border border-slate-300 rounded-lg overflow-hidden bg-slate-50">
                  <button onclick="updateQty('${item.id}', -1)" class="px-2 py-0.5 text-xs font-bold text-slate-600 hover:bg-slate-200">-</button>
                  <span class="px-2 text-xs font-bold text-slate-800">${itemState.qty}</span>
                  <button onclick="updateQty('${item.id}', 1)" class="px-2 py-0.5 text-xs font-bold text-slate-600 hover:bg-slate-200">+</button>
                </div>
              ` : ''}
              
              <input type="checkbox" 
                     id="chk-${item.id}"
                     ${itemState.checked ? 'checked' : ''} 
                     onchange="toggleCheck('${item.id}', '${item.name}', ${item.price})" 
                     class="w-5 h-5 accent-blue-900 rounded cursor-pointer">
            </div>
          </div>
        `;
      }).join('');
    }

    // CHECKBOX TOGGLE
    function toggleCheck(id, name, price) {
      if (!selectedItems[id]) {
        selectedItems[id] = { name, price, qty: 1, checked: true };
      } else {
        selectedItems[id].checked = !selectedItems[id].checked;
      }
      renderMenuList();
      calculateTotal();
    }

    // QUANTITY UPDATE
    function updateQty(id, change) {
      if (selectedItems[id]) {
        selectedItems[id].qty += change;
        if (selectedItems[id].qty <= 0) {
          selectedItems[id].qty = 1;
          selectedItems[id].checked = false;
        }
      }
      renderMenuList();
      calculateTotal();
    }

    // CALCULATE TOTAL
    function calculateTotal() {
      let grandTotal = 0;
      Object.keys(selectedItems).forEach(id => {
        const item = selectedItems[id];
        if (item.checked) {
          grandTotal += item.price * item.qty;
        }
      });
      document.getElementById('total-price').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
    }

    // DIRECT REDIRECT TO WHATSAPP
    function sendOrderWA() {
      const activeItems = Object.values(selectedItems).filter(item => item.checked);
      if (activeItems.length === 0) {
        alert("Silakan pilih minimal 1 jajanan/minuman terlebih dahulu!");
        return;
      }

      let total = 0;
      let text = `*PESANAN JASTIP SARLEM*\n_(Pasar Malam Wanajaya)_\n\n`;
      text += `*Daftar Titipan:*\n`;

      activeItems.forEach((item, index) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        text += `${index + 1}. ${item.name} (${item.qty}x) = Rp ${subtotal.toLocaleString('id-ID')}\n`;
      });

      text += `\n*Total Harga:* Rp ${total.toLocaleString('id-ID')}\n`;
      text += `\n_Mohon diproses min, terima kasih!_`;

      const encodedText = encodeURIComponent(text);
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodedText}`, '_blank');
    }

    // INITIAL RENDER
    renderMenuList();
  </script>
</body>
</html>
